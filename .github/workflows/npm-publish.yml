name: Publish (npm)

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release Candidate workflow run ID
        required: true
        type: string
      candidate_sha:
        description: Approved full commit SHA (must equal origin/main and candidate run head)
        required: true
        type: string
      tarball_sha256:
        description: Approved SHA-256 of the exact npm tarball to publish
        required: true
        type: string

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish exact approved tarball (manual main only)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate approved release inputs
        id: approval
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          TARBALL_SHA256: ${{ inputs.tarball_sha256 }}
        run: |
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "candidate_run_id must be numeric."
            exit 1
          fi
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$TARBALL_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "tarball_sha256 must be a 64-character SHA-256 digest."
            exit 1
          fi

          echo "run_id=$CANDIDATE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=${CANDIDATE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "sha256=${TARBALL_SHA256,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.approval.outputs.sha }}
          fetch-depth: 0

      - name: Verify approved source is the immutable main tip
        env:
          CANDIDATE_SHA: ${{ steps.approval.outputs.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$CANDIDATE_SHA" ]; then
            echo "Checked out $checked_out_sha, expected approved SHA $CANDIDATE_SHA."
            exit 1
          fi

          git fetch --no-tags origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "$CANDIDATE_SHA" ]; then
            echo "origin/main is $main_sha, not approved SHA $CANDIDATE_SHA."
            exit 1
          fi

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1

      - name: Read package version
        id: package
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if [ "$name" != "@florasync/leaflet-geokit" ] || [ -z "$version" ]; then
            echo "Unexpected package identity: $name@$version"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify successful candidate workflow run
        env:
          CANDIDATE_RUN_ID: ${{ steps.approval.outputs.run_id }}
          CANDIDATE_SHA: ${{ steps.approval.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")"
          run_sha="$(jq -r '.head_sha' <<< "$run_json")"
          run_branch="$(jq -r '.head_branch' <<< "$run_json")"
          run_event="$(jq -r '.event' <<< "$run_json")"
          run_status="$(jq -r '.status' <<< "$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<< "$run_json")"
          run_path="$(jq -r '.path' <<< "$run_json")"

          if [ "$run_sha" != "$CANDIDATE_SHA" ] || \
             [ "$run_branch" != "develop" ] || \
             [ "$run_event" != "push" ] || \
             [ "$run_status" != "completed" ] || \
             [ "$run_conclusion" != "success" ] || \
             [ "$run_path" != ".github/workflows/release-candidate.yml" ]; then
            echo "Candidate run is not a successful develop push validation of $CANDIDATE_SHA."
            exit 1
          fi

      - name: Download exact tested npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package-${{ steps.approval.outputs.sha }}
          path: release-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.approval.outputs.run_id }}

      - name: Verify approved package bytes and provenance metadata
        id: artifact
        env:
          CANDIDATE_SHA: ${{ steps.approval.outputs.sha }}
          EXPECTED_SHA256: ${{ steps.approval.outputs.sha256 }}
          EXPECTED_NAME: ${{ steps.package.outputs.name }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          metadata="release-artifact/candidate-metadata.json"
          if [ ! -f "$metadata" ]; then
            echo "Candidate metadata is missing."
            exit 1
          fi

          mapfile -d '' archives < <(find release-artifact -type f -name '*.tgz' -print0)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one npm tarball, found ${#archives[@]}."
            exit 1
          fi
          archive="${archives[0]}"
          archive_name="$(basename "$archive")"
          actual_sha256="$(sha256sum "$archive" | awk '{print $1}')"

          metadata_sha="$(jq -r '.candidateSha' "$metadata")"
          metadata_archive="$(jq -r '.archiveName' "$metadata")"
          metadata_digest="$(jq -r '.archiveSha256' "$metadata")"
          metadata_name="$(jq -r '.packageName' "$metadata")"
          metadata_version="$(jq -r '.packageVersion' "$metadata")"

          if [ "$metadata_sha" != "$CANDIDATE_SHA" ] || \
             [ "$metadata_archive" != "$archive_name" ] || \
             [ "$metadata_digest" != "$EXPECTED_SHA256" ] || \
             [ "$metadata_name" != "$EXPECTED_NAME" ] || \
             [ "$metadata_version" != "$EXPECTED_VERSION" ] || \
             [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Candidate artifact, metadata, source, or approved SHA-256 does not match."
            exit 1
          fi

          archive_package_json="$(tar -xOf "$archive" package/package.json)"
          archive_name_value="$(jq -r '.name' <<< "$archive_package_json")"
          archive_version_value="$(jq -r '.version' <<< "$archive_package_json")"
          if [ "$archive_name_value" != "$EXPECTED_NAME" ] || [ "$archive_version_value" != "$EXPECTED_VERSION" ]; then
            echo "Tarball contains $archive_name_value@$archive_version_value, expected $EXPECTED_NAME@$EXPECTED_VERSION."
            exit 1
          fi

          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "Verified approved tarball SHA-256: $actual_sha256"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure release tag does not already exist
        run: |
          if git rev-parse "v${{ steps.package.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.package.outputs.version }} already exists."
            exit 1
          fi

      - name: Ensure package version is unpublished
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          package_spec="$PACKAGE_NAME@$PACKAGE_VERSION"
          error_log="$RUNNER_TEMP/npm-view-error.log"
          if npm view "$package_spec" version > /dev/null 2> "$error_log"; then
            echo "$package_spec is already published."
            exit 1
          fi
          if ! grep -q 'E404' "$error_log"; then
            cat "$error_log"
            echo "Could not prove $package_spec is unpublished."
            exit 1
          fi

      - name: Publish exact approved tarball
        env:
          TARBALL_PATH: ${{ steps.artifact.outputs.path }}
        run: npm publish "./$TARBALL_PATH" --access public --provenance

      - name: Verify immutable registry bytes and integrity
        env:
          EXPECTED_SHA256: ${{ steps.approval.outputs.sha256 }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          package_spec="$PACKAGE_NAME@$PACKAGE_VERSION"
          registry_tarball=""
          registry_integrity=""
          for attempt in {1..12}; do
            registry_tarball="$(npm view "$package_spec" dist.tarball 2>/dev/null || true)"
            registry_integrity="$(npm view "$package_spec" dist.integrity 2>/dev/null || true)"
            if [ -n "$registry_tarball" ] && [ -n "$registry_integrity" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$registry_tarball" ] || [ -z "$registry_integrity" ]; then
            echo "Registry metadata did not become available for $package_spec."
            exit 1
          fi

          downloaded="$RUNNER_TEMP/registry-package.tgz"
          curl --fail --silent --show-error --location "$registry_tarball" --output "$downloaded"
          registry_sha256="$(sha256sum "$downloaded" | awk '{print $1}')"
          if [ "$registry_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Registry tarball SHA-256 $registry_sha256 does not match approved $EXPECTED_SHA256."
            exit 1
          fi

          REGISTRY_INTEGRITY="$registry_integrity" DOWNLOADED_TARBALL="$downloaded" node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const actual =
            'sha512-' +
            crypto
              .createHash('sha512')
              .update(fs.readFileSync(process.env.DOWNLOADED_TARBALL))
              .digest('base64');
          if (actual !== process.env.REGISTRY_INTEGRITY) {
            console.error('Registry integrity mismatch: ' + actual);
            process.exit(1);
          }
          NODE

          echo "Registry verified: $package_spec sha256=$registry_sha256 integrity=$registry_integrity"

      - name: Verify version-pinned Django browser entrypoint
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          django_url="https://cdn.jsdelivr.net/npm/@florasync/leaflet-geokit@$PACKAGE_VERSION/dist/django/index.js"
          downloaded="$RUNNER_TEMP/django-index.js"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$django_url" --output "$downloaded" && [ -s "$downloaded" ]; then
              echo "Browser-loadable Django entrypoint verified: $django_url"
              exit 0
            fi
            sleep 5
          done
          echo "Version-pinned Django entrypoint was not browser-loadable: $django_url"
          exit 1

      - name: Tag release
        run: git tag "v${{ steps.package.outputs.version }}"

      - name: Push tag
        run: git push origin "v${{ steps.package.outputs.version }}"
