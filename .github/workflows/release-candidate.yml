name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to validate (validation only; manual runs never promote)
        required: true
        type: string
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      tarball_sha256: ${{ steps.package.outputs.sha256 }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    env:
      HUSKY: 0
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Bind validation to exact candidate SHA
        id: candidate
        env:
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "candidate_sha must be a full 40-character commit SHA."
            exit 1
          fi

          requested_sha="${REQUESTED_SHA,,}"
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$requested_sha" ]; then
            echo "Checked out $checked_out_sha, expected $requested_sha."
            exit 1
          fi

          echo "sha=$checked_out_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run prettier:check

      - name: Lint
        run: npm run lint

      - name: Validate release candidate
        run: npm run release:dry

      - name: Install Playwright browsers
        run: npm run e2e:install

      - name: Run E2E checks
        run: npx playwright test --config playwright.release.config.ts

      - name: Create immutable npm package artifact
        id: package
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          artifact_dir="$RUNNER_TEMP/release-artifact"
          mkdir -p "$artifact_dir"
          npm pack --pack-destination "$artifact_dir"

          shopt -s nullglob
          archives=("$artifact_dir"/*.tgz)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "Expected exactly one npm tarball, found ${#archives[@]}."
            exit 1
          fi

          archive="${archives[0]}"
          archive_name="$(basename "$archive")"
          archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
          package_name="$(node -p 'require("./package.json").name')"
          package_version="$(node -p 'require("./package.json").version')"

          CANDIDATE_SHA="$CANDIDATE_SHA" \
          ARCHIVE_NAME="$archive_name" \
          ARCHIVE_SHA256="$archive_sha256" \
          PACKAGE_NAME="$package_name" \
          PACKAGE_VERSION="$package_version" \
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const metadata = {
            candidateSha: process.env.CANDIDATE_SHA,
            archiveName: process.env.ARCHIVE_NAME,
            archiveSha256: process.env.ARCHIVE_SHA256,
            packageName: process.env.PACKAGE_NAME,
            packageVersion: process.env.PACKAGE_VERSION,
          };
          fs.writeFileSync(
            path.join(process.env.RUNNER_TEMP, 'release-artifact', 'candidate-metadata.json'),
            JSON.stringify(metadata, null, 2) + '\n',
          );
          NODE

          artifact_name="npm-package-$CANDIDATE_SHA"
          echo "sha256=$archive_sha256" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Candidate artifact: $artifact_name ($archive_sha256)"

      - name: Upload immutable npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/release-artifact
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  promote-main:
    name: Promote tested candidate to main
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify tested candidate is still the develop tip
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: |
          git fetch origin main develop
          develop_sha="$(git rev-parse origin/develop)"
          if [ "$develop_sha" != "$CANDIDATE_SHA" ]; then
            echo "develop moved to $develop_sha after candidate $CANDIDATE_SHA was tested."
            exit 1
          fi
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"

      - name: Promote exact tested candidate
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
        run: git push origin "${CANDIDATE_SHA}:refs/heads/main"
